<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界史まとめ図・相関図作成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper-1:#efe6d3;
    --paper-2:#e3d6b8;
    --ink:#2c2a25;
    --ink-soft:#665f4c;
    --navy:#1f2a44;
    --navy-2:#2c3a5e;
    --gold:#c9a227;
    --gold-soft:#e4c766;
    --line-grid: rgba(90,80,55,0.14);
    --panel-border:#3a3225;

    --cat-person-bg:#fbeecb;   --cat-person-bd:#b98a1e;
    --cat-state-bg:#dbe5f6;    --cat-state-bd:#2f4b7c;
    --cat-place-bg:#dfeed9;    --cat-place-bd:#3f7d50;
    --cat-event-bg:#f6dbd9;    --cat-event-bd:#9b2c2c;
    --cat-concept-bg:#e9dff2;  --cat-concept-bd:#6a4c93;
    --cat-goods-bg:#efdfc4;    --cat-goods-bd:#8b5e34;
    --cat-free-bg:#eeeeea;     --cat-free-bd:#666660;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans JP',sans-serif;color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;background:var(--paper-1);}

  /* ---------- Header ---------- */
  header{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#f2ead0;
    border-bottom:3px solid var(--gold);padding:10px 16px 8px;flex-shrink:0;}
  .title-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .title-row .mark{font-family:'Shippori Mincho',serif;font-size:20px;color:var(--gold-soft);white-space:nowrap;letter-spacing:2px;}
  #docTitle{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(228,199,102,0.4);
    color:#f6efd8;font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;
    padding:6px 12px;border-radius:4px;outline:none;letter-spacing:1px;}
  #docTitle::placeholder{color:#c9c2a6;font-weight:500;}
  #docTitle:focus{border-color:var(--gold);background:rgba(255,255,255,0.1);}

  .toolbar-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;}
  .tool-group{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:4px 6px;}
  .tool-group .grp-label{font-size:11px;color:#cfc7a6;margin-right:2px;white-space:nowrap;}
  button.tbtn{background:#3a4a70;color:#f2ead0;border:1px solid rgba(255,255,255,0.15);
    border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap;
    font-family:'Noto Sans JP',sans-serif;transition:background .15s,transform .1s;}
  button.tbtn:hover{background:#4c5f8c;}
  button.tbtn:active{transform:translateY(1px);}
  button.tbtn.active{background:var(--gold);color:#2b2a1c;border-color:var(--gold-soft);font-weight:700;}
  button.tbtn.danger{background:#7c2b2b;}
  button.tbtn.danger:hover{background:#9b3737;}
  select.tsel{background:#243356;color:#f2ead0;border:1px solid rgba(255,255,255,0.2);
    border-radius:5px;padding:4px 6px;font-size:12px;font-family:'Noto Sans JP',sans-serif;}
  .cat-btn{display:flex;align-items:center;gap:4px;}
  .cat-swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  /* ---------- Viewport / Canvas ---------- */
  #viewport{position:relative;flex:1;overflow:hidden;cursor:grab;
    background-image:
      linear-gradient(var(--line-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
    background-size:40px 40px;
    background-color:var(--paper-2);
  }
  #viewport.panning{cursor:grabbing;}
  #viewport.mode-connector{cursor:crosshair;}
  #viewport.mode-group{cursor:crosshair;}

  #world{position:absolute;left:0;top:0;width:9000px;height:7000px;transform-origin:0 0;}

  svg#connectorLayer{position:absolute;left:0;top:0;width:9000px;height:7000px;overflow:visible;pointer-events:none;}
  svg#connectorLayer path.hit{pointer-events:stroke;cursor:pointer;}
  svg#connectorLayer .selected-halo{filter:drop-shadow(0 0 3px #2b7de9);}

  /* ---------- Group (region) ---------- */
  .group-box{position:absolute;border:2px dashed var(--ink-soft);border-radius:6px;
    background:rgba(255,255,255,0.10);}
  .group-box.selected{border-color:#2b7de9;box-shadow:0 0 0 2px rgba(43,125,233,0.35);}
  .group-label{position:absolute;top:-13px;left:10px;background:var(--paper-1);
    border:1px solid var(--ink-soft);border-radius:4px;padding:1px 8px;font-size:13px;
    font-family:'Shippori Mincho',serif;font-weight:700;color:var(--ink);outline:none;cursor:text;}
  .group-del{position:absolute;top:-13px;right:6px;width:18px;height:18px;border-radius:50%;
    border:1px solid var(--ink-soft);background:#fff;color:#7c2b2b;font-size:12px;line-height:16px;
    text-align:center;cursor:pointer;padding:0;}
  .group-resize{position:absolute;width:14px;height:14px;right:-7px;bottom:-7px;
    background:var(--paper-1);border:2px solid var(--ink-soft);border-radius:3px;cursor:nwse-resize;}

  /* ---------- Cards ---------- */
  .card{position:absolute;width:220px;border-radius:8px;border:2px solid #999;
    box-shadow:1px 2px 4px rgba(0,0,0,0.25);font-size:12px;background:#fff;
    display:flex;flex-direction:column;user-select:none;}
  .card.selected{box-shadow:0 0 0 3px rgba(43,125,233,0.55), 1px 2px 4px rgba(0,0,0,0.25);}
  .card.connector-pending{box-shadow:0 0 0 3px rgba(201,162,39,0.85), 1px 2px 4px rgba(0,0,0,0.25);}
  .card-bar{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px 6px 0 0;
    cursor:move;font-weight:700;}
  .card-icon{font-size:13px;}
  .card-cat-label{flex:1;font-size:10px;opacity:0.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-del{border:none;background:rgba(0,0,0,0.12);color:#3a2f1f;width:17px;height:17px;
    border-radius:50%;cursor:pointer;font-size:11px;line-height:15px;padding:0;flex-shrink:0;}
  .card-del:hover{background:rgba(0,0,0,0.25);}
  .card-title{padding:6px 8px 2px;font-weight:700;font-size:13.5px;cursor:text;min-height:18px;
    outline:none;line-height:1.3;word-break:break-word;font-family:'Shippori Mincho',serif;}
  .card-title:empty:before{content:attr(data-placeholder);color:#999;font-weight:400;}
  .card-memo{margin:2px 6px 6px;padding:4px 6px;border:1px solid rgba(0,0,0,0.12);border-radius:4px;
    background:rgba(255,255,255,0.55);font-size:11.5px;font-family:'Noto Sans JP',sans-serif;
    resize:none;overflow:hidden;min-height:32px;line-height:1.4;color:#333;cursor:text;}
  .card-memo:focus{background:#fff;border-color:#999;}

  .cat-person   .card-bar{background:var(--cat-person-bg); }
  .cat-state    .card-bar{background:var(--cat-state-bg); }
  .cat-place    .card-bar{background:var(--cat-place-bg); }
  .cat-event    .card-bar{background:var(--cat-event-bg); }
  .cat-concept  .card-bar{background:var(--cat-concept-bg); }
  .cat-goods    .card-bar{background:var(--cat-goods-bg); }
  .cat-free     .card-bar{background:var(--cat-free-bg); }
  .cat-person{border-color:var(--cat-person-bd);}
  .cat-state{border-color:var(--cat-state-bd);}
  .cat-place{border-color:var(--cat-place-bd);}
  .cat-event{border-color:var(--cat-event-bd);}
  .cat-concept{border-color:var(--cat-concept-bd);}
  .cat-goods{border-color:var(--cat-goods-bd);}
  .cat-free{border-color:var(--cat-free-bd);}

  .group-draft{position:absolute;border:2px dashed #2b7de9;background:rgba(43,125,233,0.08);pointer-events:none;}

  /* ---------- Footer hint ---------- */
  #hint{flex-shrink:0;background:var(--navy);color:#cfc7a6;font-size:11px;padding:4px 12px;
    border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;}
  #hint span.k{color:var(--gold-soft);font-weight:700;}

  /* compass rose decoration */
  #compass{position:absolute;right:18px;bottom:34px;width:70px;height:70px;opacity:0.35;pointer-events:none;}

  input[type=file]{display:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title-row">
      <span class="mark">⚜</span>
      <input id="docTitle" placeholder="タイトルを入力（例：大航海時代とヨーロッパの世界進出）" />
      <span class="mark">⚜</span>
    </div>
    <div class="toolbar-row">
      <div class="tool-group" id="addCardGroup">
        <span class="grp-label">カード追加:</span>
        <!-- buttons injected by JS -->
      </div>

      <div class="tool-group">
        <button class="tbtn" id="connectorModeBtn" title="2枚のカードを順にクリックして矢印で接続します">🔗 矢印モード</button>
        <select class="tsel" id="presetSelect" title="よく使う組み合わせのプリセット">
          <option value="">プリセット…</option>
          <option value="causal">因果・時系列（実線→）</option>
          <option value="sync">関連・同時代性（点線）</option>
          <option value="move">人・モノ・文化の移動（太線→）</option>
          <option value="conflict">対立・戦争（赤線）</option>
          <option value="alliance">同盟・条約（青線）</option>
        </select>
        <select class="tsel" id="lineStyleSelect" title="線の種類">
          <option value="solid">実線</option>
          <option value="dashed">点線</option>
          <option value="thick">太線</option>
          <option value="wave">波線</option>
        </select>
        <select class="tsel" id="arrowHeadSelect" title="矢印の向き">
          <option value="one">片矢印 →</option>
          <option value="two">双方向 ↔</option>
          <option value="none">矢印なし －</option>
        </select>
        <select class="tsel" id="colorSelect" title="線の色">
          <option value="default">標準色</option>
          <option value="red">赤（対立・戦争）</option>
          <option value="blue">青（同盟・条約）</option>
        </select>
      </div>

      <div class="tool-group">
        <button class="tbtn" id="groupModeBtn" title="ドラッグして「17世紀」「ヨーロッパ」等の領域枠を作成">▭ グループ枠作成</button>
      </div>

      <div class="tool-group">
        <button class="tbtn" id="zoomOutBtn">－</button>
        <button class="tbtn" id="zoomResetBtn">100%</button>
        <button class="tbtn" id="zoomInBtn">＋</button>
      </div>

      <div class="tool-group">
        <button class="tbtn" id="exportJsonBtn">💾 JSON保存</button>
        <button class="tbtn" id="importJsonBtn">📂 JSON読込</button>
        <input type="file" id="importFileInput" accept="application/json" />
        <button class="tbtn" id="exportPngBtn">🖼 PNG出力</button>
        <button class="tbtn" id="exportPdfBtn">📄 PDF出力</button>
      </div>

      <div class="tool-group">
        <button class="tbtn danger" id="deleteBtn">🗑 選択削除</button>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="world">
      <svg id="connectorLayer"><defs id="markerDefs"></defs></svg>
    </div>
    <svg id="compass" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#2c2a25" stroke-width="2"/>
      <polygon points="50,6 58,50 50,94 42,50" fill="#2c2a25"/>
      <polygon points="6,50 50,42 94,50 50,58" fill="#2c2a25"/>
      <circle cx="50" cy="50" r="4" fill="#c9a227"/>
      <text x="50" y="18" text-anchor="middle" font-size="10" font-family="Shippori Mincho, serif" fill="#2c2a25">N</text>
    </svg>
  </div>

  <div id="hint">
    <span><span class="k">左ドラッグ</span>：何もない場所でパン／カード上でドラッグして移動　<span class="k">ホイール</span>：ズーム　<span class="k">Delete</span>：選択削除</span>
    <span id="statusMsg"></span>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   定数・データ定義
========================================================= */
const WORLD_W = 9000, WORLD_H = 7000;

const CATEGORY_DEFS = {
  person:  {label:'人物',            icon:'👤', cls:'cat-person'},
  state:   {label:'国家・王朝・組織', icon:'🏛', cls:'cat-state'},
  place:   {label:'地名・領域',       icon:'🗺', cls:'cat-place'},
  event:   {label:'出来事',           icon:'⚔', cls:'cat-event'},
  concept: {label:'概念・文化・宗教', icon:'📜', cls:'cat-concept'},
  goods:   {label:'物品・資源',       icon:'🏺', cls:'cat-goods'},
  free:    {label:'フリーカード',     icon:'📝', cls:'cat-free'}
};
const SWATCH_COLORS = {
  person:'#c9a227', state:'#2f4b7c', place:'#3f7d50', event:'#9b2c2c',
  concept:'#6a4c93', goods:'#8b5e34', free:'#666660'
};

const COLOR_HEX = { default:'#2c2a25', red:'#c0392b', blue:'#2864b3' };

const PRESETS = {
  causal:   {lineStyle:'solid',  arrow:'one',  color:'default'},
  sync:     {lineStyle:'dashed', arrow:'none', color:'default'},
  move:     {lineStyle:'thick',  arrow:'one',  color:'default'},
  conflict: {lineStyle:'solid',  arrow:'one',  color:'red'},
  alliance: {lineStyle:'solid',  arrow:'one',  color:'blue'}
};

let idSeq = 1;
function uid(prefix){ return prefix + (idSeq++) + '_' + Math.random().toString(36).slice(2,7); }

/* =========================================================
   アプリ状態
========================================================= */
let state = {
  title: '',
  cards: [],      // {id,type,x,y,title,memo}
  connectors: [], // {id,fromId,toId,lineStyle,arrow,color}
  groups: []      // {id,x,y,w,h,label}
};

let view = { scale:1, pan:{x:400,y:250} };

let mode = 'select'; // 'select' | 'connector' | 'group'
let pendingConnectorFrom = null;
let selected = { type:null, id:null };

/* DOM refs */
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const svg = document.getElementById('connectorLayer');
const markerDefs = document.getElementById('markerDefs');
const docTitleInput = document.getElementById('docTitle');
const statusMsg = document.getElementById('statusMsg');

const cardEls = new Map();   // id -> element
const groupEls = new Map();  // id -> element

/* =========================================================
   初期化
========================================================= */
function init(){
  buildAddCardButtons();
  buildMarkerDefs();
  applyViewTransform();
  bindToolbar();
  bindViewportEvents();
  bindGlobalKeys();
  docTitleInput.addEventListener('input', ()=>{ state.title = docTitleInput.value; });
  setStatus('準備完了');
}

function buildAddCardButtons(){
  const wrap = document.getElementById('addCardGroup');
  Object.keys(CATEGORY_DEFS).forEach(type=>{
    const def = CATEGORY_DEFS[type];
    const btn = document.createElement('button');
    btn.className = 'tbtn cat-btn';
    btn.innerHTML = `<span class="cat-swatch" style="background:${SWATCH_COLORS[type]}"></span>${def.icon} ${def.label}`;
    btn.title = def.label + ' カードを追加';
    btn.addEventListener('click', ()=> addCard(type));
    wrap.appendChild(btn);
  });
}

function buildMarkerDefs(){
  const colors = Object.keys(COLOR_HEX);
  let html = '';
  colors.forEach(c=>{
    const hex = COLOR_HEX[c];
    html += `
    <marker id="arrow-end-${c}" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="${hex}"></path>
    </marker>
    <marker id="arrow-start-${c}" markerWidth="10" markerHeight="10" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="${hex}"></path>
    </marker>`;
  });
  markerDefs.innerHTML = html;
}

/* =========================================================
   座標変換 / 表示
========================================================= */
function applyViewTransform(){
  world.style.transform = `translate(${view.pan.x}px, ${view.pan.y}px) scale(${view.scale})`;
  document.getElementById('zoomResetBtn').textContent = Math.round(view.scale*100)+'%';
}
function screenToWorld(clientX, clientY){
  const r = viewport.getBoundingClientRect();
  return {
    x: (clientX - r.left - view.pan.x)/view.scale,
    y: (clientY - r.top  - view.pan.y)/view.scale
  };
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function setStatus(msg){ statusMsg.textContent = msg; }

/* =========================================================
   カード
========================================================= */
function addCard(type, x, y){
  const rect = viewport.getBoundingClientRect();
  let wx, wy;
  if(x===undefined){
    const c = screenToWorld(rect.left + rect.width/2 + (Math.random()*60-30), rect.top + rect.height/2 + (Math.random()*60-30));
    wx = c.x; wy = c.y;
  } else { wx = x; wy = y; }
  const card = { id: uid('card'), type, x: wx, y: wy, title:'', memo:'' };
  state.cards.push(card);
  renderCard(card);
  selectItem('card', card.id);
  renderConnectors();
  setStatus(CATEGORY_DEFS[type].label + 'カードを追加しました');
}

function renderCard(card){
  const def = CATEGORY_DEFS[card.type];
  const el = document.createElement('div');
  el.className = 'card ' + def.cls;
  el.dataset.id = card.id;
  el.style.left = card.x + 'px';
  el.style.top = card.y + 'px';
  el.innerHTML = `
    <div class="card-bar">
      <span class="card-icon">${def.icon}</span>
      <span class="card-cat-label">${def.label}</span>
      <button class="card-del" title="削除">×</button>
    </div>
    <div class="card-title" contenteditable="true" data-placeholder="タイトル"></div>
    <textarea class="card-memo" placeholder="詳細メモ..." rows="2"></textarea>
  `;
  world.appendChild(el);
  cardEls.set(card.id, el);

  const titleEl = el.querySelector('.card-title');
  const memoEl = el.querySelector('.card-memo');
  titleEl.textContent = card.title;
  memoEl.value = card.memo;
  autosize(memoEl);

  titleEl.addEventListener('input', ()=>{ card.title = titleEl.textContent; });
  titleEl.addEventListener('mousedown', e=> e.stopPropagation());
  titleEl.addEventListener('blur', renderConnectors);

  memoEl.addEventListener('input', ()=>{ card.memo = memoEl.value; autosize(memoEl); renderConnectors(); });
  memoEl.addEventListener('mousedown', e=> e.stopPropagation());

  el.querySelector('.card-del').addEventListener('click', (e)=>{ e.stopPropagation(); deleteCard(card.id); });

  el.addEventListener('mousedown', (e)=> onCardMouseDown(e, card));
  el.addEventListener('click', (e)=>{ if(mode==='connector') e.stopPropagation(); });
}

function autosize(ta){
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight) + 'px';
}

function onCardMouseDown(e, card){
  if(e.target.closest('.card-del')) return;

  if(mode === 'connector'){
    e.stopPropagation();
    handleConnectorPick(card.id);
    return;
  }
  if(e.target.closest('.card-title') || e.target.closest('.card-memo')){
    e.stopPropagation();
    selectItem('card', card.id);
    return;
  }
  e.stopPropagation();
  selectItem('card', card.id);
  startDragCard(e, card);
}

function startDragCard(e, card){
  const startClient = {x:e.clientX, y:e.clientY};
  const startPos = {x:card.x, y:card.y};
  let moved = false;

  function onMove(ev){
    const dx = (ev.clientX - startClient.x)/view.scale;
    const dy = (ev.clientY - startClient.y)/view.scale;
    if(Math.abs(dx)+Math.abs(dy) > 2) moved = true;
    card.x = startPos.x + dx;
    card.y = startPos.y + dy;
    const el = cardEls.get(card.id);
    el.style.left = card.x+'px';
    el.style.top = card.y+'px';
    renderConnectors();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if(moved) setStatus('カードを移動しました');
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function deleteCard(id){
  state.cards = state.cards.filter(c=>c.id!==id);
  const el = cardEls.get(id); if(el) el.remove();
  cardEls.delete(id);
  state.connectors = state.connectors.filter(c=>{
    const drop = c.fromId===id || c.toId===id;
    return !drop;
  });
  if(selected.type==='card' && selected.id===id) clearSelection();
  renderConnectors();
}

function getCardRect(id){
  const el = cardEls.get(id);
  const card = state.cards.find(c=>c.id===id);
  if(!el || !card) return null;
  return { x:card.x, y:card.y, w:el.offsetWidth, h:el.offsetHeight };
}

/* =========================================================
   コネクタ（矢印）
========================================================= */
function handleConnectorPick(cardId){
  if(!pendingConnectorFrom){
    pendingConnectorFrom = cardId;
    cardEls.get(cardId).classList.add('connector-pending');
    setStatus('接続先のカードをクリックしてください（同じカードをもう一度クリックでキャンセル）');
    return;
  }
  if(pendingConnectorFrom === cardId){
    cardEls.get(cardId).classList.remove('connector-pending');
    pendingConnectorFrom = null;
    setStatus('矢印作成をキャンセルしました');
    return;
  }
  const style = getCurrentConnectorStyle();
  const conn = { id: uid('conn'), fromId: pendingConnectorFrom, toId: cardId,
                 lineStyle: style.lineStyle, arrow: style.arrow, color: style.color };
  state.connectors.push(conn);
  cardEls.get(pendingConnectorFrom).classList.remove('connector-pending');
  pendingConnectorFrom = null;
  renderConnectors();
  setStatus('矢印を作成しました');
}

function getCurrentConnectorStyle(){
  return {
    lineStyle: document.getElementById('lineStyleSelect').value,
    arrow: document.getElementById('arrowHeadSelect').value,
    color: document.getElementById('colorSelect').value
  };
}

function borderIntersection(rect, tx, ty){
  const cx = rect.x + rect.w/2, cy = rect.y + rect.h/2;
  const dx = tx - cx, dy = ty - cy;
  if(dx===0 && dy===0) return {x:cx,y:cy};
  const hw = rect.w/2, hh = rect.h/2;
  const scaleX = dx!==0 ? hw/Math.abs(dx) : Infinity;
  const scaleY = dy!==0 ? hh/Math.abs(dy) : Infinity;
  const s = Math.min(scaleX, scaleY);
  return { x: cx + dx*s, y: cy + dy*s };
}

function wavePath(x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx+dy*dy) || 1;
  const ux = dx/len, uy = dy/len;
  const nx = -uy, ny = ux;
  const amp = 8, wavelength = 26;
  const segs = Math.max(2, Math.round(len/wavelength));
  let d = `M ${x1} ${y1} `;
  for(let i=1;i<=segs;i++){
    const t0 = (i-0.5)/segs, t1 = i/segs;
    const sign = (i%2===0)? -1: 1;
    const midX = x1 + dx*t0 + nx*amp*sign;
    const midY = y1 + dy*t0 + ny*amp*sign;
    const endX = x1 + dx*t1;
    const endY = y1 + dy*t1;
    d += `Q ${midX} ${midY} ${endX} ${endY} `;
  }
  return d;
}

function renderConnectors(){
  // remove old
  svg.querySelectorAll('g.connector').forEach(g=>g.remove());
  state.connectors.forEach(conn=>{
    const rFrom = getCardRect(conn.fromId);
    const rTo = getCardRect(conn.toId);
    if(!rFrom || !rTo) return;
    const c1 = {x:rFrom.x+rFrom.w/2, y:rFrom.y+rFrom.h/2};
    const c2 = {x:rTo.x+rTo.w/2, y:rTo.y+rTo.h/2};
    const p1 = borderIntersection(rFrom, c2.x, c2.y);
    const p2 = borderIntersection(rTo, c1.x, c1.y);

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','connector');
    g.dataset.id = conn.id;

    let d;
    if(conn.lineStyle === 'wave'){
      d = wavePath(p1.x,p1.y,p2.x,p2.y);
    } else {
      d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    }

    const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d', d);
    hit.setAttribute('class','hit');
    hit.setAttribute('stroke','transparent');
    hit.setAttribute('stroke-width','16');
    hit.setAttribute('fill','none');
    hit.addEventListener('mousedown', e=> e.stopPropagation());
    hit.addEventListener('click', (e)=>{ e.stopPropagation(); selectItem('connector', conn.id); });

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none');
    const color = COLOR_HEX[conn.color] || COLOR_HEX.default;
    path.setAttribute('stroke', color);
    let sw = 2.4;
    if(conn.lineStyle==='thick') sw = 6.5;
    if(conn.lineStyle==='wave') sw = 3;
    path.setAttribute('stroke-width', sw);
    path.setAttribute('stroke-linecap','round');
    if(conn.lineStyle==='dashed') path.setAttribute('stroke-dasharray','9,7');
    if(conn.arrow==='one' || conn.arrow==='two') path.setAttribute('marker-end', `url(#arrow-end-${conn.color})`);
    if(conn.arrow==='two') path.setAttribute('marker-start', `url(#arrow-start-${conn.color})`);

    if(selected.type==='connector' && selected.id===conn.id){
      path.classList.add('selected-halo');
    }

    g.appendChild(hit);
    g.appendChild(path);
    svg.appendChild(g);
  });
}

/* =========================================================
   グループ枠
========================================================= */
function renderGroup(group){
  const el = document.createElement('div');
  el.className = 'group-box';
  el.dataset.id = group.id;
  el.style.left = group.x+'px';
  el.style.top = group.y+'px';
  el.style.width = group.w+'px';
  el.style.height = group.h+'px';
  el.style.zIndex = 1;
  el.innerHTML = `
    <div class="group-label" contenteditable="true"></div>
    <button class="group-del" title="削除">×</button>
    <div class="group-resize" title="サイズ変更"></div>
  `;
  world.insertBefore(el, world.firstChild.nextSibling || null);
  groupEls.set(group.id, el);

  const labelEl = el.querySelector('.group-label');
  labelEl.textContent = group.label;
  labelEl.addEventListener('input', ()=>{ group.label = labelEl.textContent; });
  labelEl.addEventListener('mousedown', e=> e.stopPropagation());

  el.querySelector('.group-del').addEventListener('click', (e)=>{ e.stopPropagation(); deleteGroup(group.id); });

  el.addEventListener('mousedown', (e)=>{
    if(e.target.closest('.group-label') || e.target.closest('.group-del') || e.target.closest('.group-resize')) return;
    e.stopPropagation();
    selectItem('group', group.id);
    startDragGroup(e, group);
  });

  el.querySelector('.group-resize').addEventListener('mousedown', (e)=>{
    e.stopPropagation();
    startResizeGroup(e, group);
  });
}

function startDragGroup(e, group){
  const startClient = {x:e.clientX, y:e.clientY};
  const startPos = {x:group.x, y:group.y};
  const contained = state.cards.filter(c=>{
    const el = cardEls.get(c.id);
    const w = el? el.offsetWidth: 220, h = el? el.offsetHeight: 60;
    const cx = c.x + w/2, cy = c.y + h/2;
    return cx>=group.x && cx<=group.x+group.w && cy>=group.y && cy<=group.y+group.h;
  });
  const cardStart = contained.map(c=>({card:c, x:c.x, y:c.y}));

  function onMove(ev){
    const dx = (ev.clientX-startClient.x)/view.scale;
    const dy = (ev.clientY-startClient.y)/view.scale;
    group.x = startPos.x+dx; group.y = startPos.y+dy;
    const el = groupEls.get(group.id);
    el.style.left = group.x+'px'; el.style.top = group.y+'px';
    cardStart.forEach(cs=>{
      cs.card.x = cs.x+dx; cs.card.y = cs.y+dy;
      const cel = cardEls.get(cs.card.id);
      if(cel){ cel.style.left = cs.card.x+'px'; cel.style.top = cs.card.y+'px'; }
    });
    renderConnectors();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResizeGroup(e, group){
  const startClient = {x:e.clientX, y:e.clientY};
  const startSize = {w:group.w, h:group.h};
  function onMove(ev){
    const dx = (ev.clientX-startClient.x)/view.scale;
    const dy = (ev.clientY-startClient.y)/view.scale;
    group.w = Math.max(80, startSize.w+dx);
    group.h = Math.max(60, startSize.h+dy);
    const el = groupEls.get(group.id);
    el.style.width = group.w+'px'; el.style.height = group.h+'px';
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function deleteGroup(id){
  state.groups = state.groups.filter(g=>g.id!==id);
  const el = groupEls.get(id); if(el) el.remove();
  groupEls.delete(id);
  if(selected.type==='group' && selected.id===id) clearSelection();
}

/* =========================================================
   選択 / 削除
========================================================= */
function selectItem(type, id){
  clearSelectionVisual();
  selected = {type, id};
  if(type==='card') cardEls.get(id)?.classList.add('selected');
  if(type==='group') groupEls.get(id)?.classList.add('selected');
  if(type==='connector') renderConnectors();
}
function clearSelectionVisual(){
  cardEls.forEach(el=>el.classList.remove('selected'));
  groupEls.forEach(el=>el.classList.remove('selected'));
}
function clearSelection(){
  clearSelectionVisual();
  selected = {type:null, id:null};
  renderConnectors();
}
function deleteSelected(){
  if(selected.type==='card') deleteCard(selected.id);
  else if(selected.type==='group') deleteGroup(selected.id);
  else if(selected.type==='connector'){
    state.connectors = state.connectors.filter(c=>c.id!==selected.id);
    clearSelection();
    renderConnectors();
  }
}

/* =========================================================
   モード切替
========================================================= */
function setMode(newMode){
  mode = newMode;
  if(pendingConnectorFrom){
    cardEls.get(pendingConnectorFrom)?.classList.remove('connector-pending');
    pendingConnectorFrom = null;
  }
  viewport.classList.remove('mode-connector','mode-group');
  document.getElementById('connectorModeBtn').classList.remove('active');
  document.getElementById('groupModeBtn').classList.remove('active');
  if(newMode==='connector'){
    viewport.classList.add('mode-connector');
    document.getElementById('connectorModeBtn').classList.add('active');
    setStatus('矢印モード：接続元のカードをクリックしてください');
  } else if(newMode==='group'){
    viewport.classList.add('mode-group');
    document.getElementById('groupModeBtn').classList.add('active');
    setStatus('グループ作成モード：ドラッグして範囲を指定してください');
  } else {
    setStatus('選択モード');
  }
}

/* =========================================================
   ビューポート操作（パン・ズーム・グループ描画）
========================================================= */
function bindViewportEvents(){
  viewport.addEventListener('mousedown', (e)=>{
    if(e.target.closest('.card') || e.target.closest('.group-box') || e.target.closest('.connector')) return;

    if(mode === 'connector'){
      if(pendingConnectorFrom){
        cardEls.get(pendingConnectorFrom).classList.remove('connector-pending');
        pendingConnectorFrom = null;
        setStatus('矢印作成をキャンセルしました');
      }
      return;
    }
    if(mode === 'group'){
      startDrawGroup(e);
      return;
    }
    clearSelection();
    startPan(e);
  });

  viewport.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    const mx = e.clientX-r.left, my = e.clientY-r.top;
    const wx = (mx-view.pan.x)/view.scale;
    const wy = (my-view.pan.y)/view.scale;
    const delta = -e.deltaY*0.0012;
    const newScale = clamp(view.scale*(1+delta), 0.2, 3);
    view.pan.x = mx - wx*newScale;
    view.pan.y = my - wy*newScale;
    view.scale = newScale;
    applyViewTransform();
  }, {passive:false});
}

function startPan(e){
  viewport.classList.add('panning');
  const startClient = {x:e.clientX, y:e.clientY};
  const startPan = {x:view.pan.x, y:view.pan.y};
  function onMove(ev){
    view.pan.x = startPan.x + (ev.clientX-startClient.x);
    view.pan.y = startPan.y + (ev.clientY-startClient.y);
    applyViewTransform();
  }
  function onUp(){
    viewport.classList.remove('panning');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startDrawGroup(e){
  const startW = screenToWorld(e.clientX, e.clientY);
  const draft = document.createElement('div');
  draft.className = 'group-draft';
  world.appendChild(draft);
  function update(x,y,w,h){
    draft.style.left=x+'px'; draft.style.top=y+'px';
    draft.style.width=w+'px'; draft.style.height=h+'px';
  }
  update(startW.x, startW.y, 1, 1);

  function onMove(ev){
    const curW = screenToWorld(ev.clientX, ev.clientY);
    const x = Math.min(startW.x, curW.x), y = Math.min(startW.y, curW.y);
    const w = Math.abs(curW.x-startW.x), h = Math.abs(curW.y-startW.y);
    update(x,y,w,h);
  }
  function onUp(ev){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    const curW = screenToWorld(ev.clientX, ev.clientY);
    draft.remove();
    let x = Math.min(startW.x, curW.x), y = Math.min(startW.y, curW.y);
    let w = Math.abs(curW.x-startW.x), h = Math.abs(curW.y-startW.y);
    if(w<40 || h<40){ w=Math.max(w,220); h=Math.max(h,140); }
    const group = { id: uid('group'), x, y, w, h, label: '新しいグループ' };
    state.groups.push(group);
    renderGroup(group);
    setMode('select');
    selectItem('group', group.id);
    setStatus('グループ枠を作成しました。ラベルを編集できます');
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* =========================================================
   ツールバー / キーボード
========================================================= */
function bindToolbar(){
  document.getElementById('connectorModeBtn').addEventListener('click', ()=>{
    setMode(mode==='connector' ? 'select' : 'connector');
  });
  document.getElementById('groupModeBtn').addEventListener('click', ()=>{
    setMode(mode==='group' ? 'select' : 'group');
  });
  document.getElementById('presetSelect').addEventListener('change', (e)=>{
    const p = PRESETS[e.target.value];
    if(!p) return;
    document.getElementById('lineStyleSelect').value = p.lineStyle;
    document.getElementById('arrowHeadSelect').value = p.arrow;
    document.getElementById('colorSelect').value = p.color;
  });

  document.getElementById('zoomInBtn').addEventListener('click', ()=> zoomBy(1.2));
  document.getElementById('zoomOutBtn').addEventListener('click', ()=> zoomBy(1/1.2));
  document.getElementById('zoomResetBtn').addEventListener('click', ()=>{
    view.scale = 1; view.pan = {x:400,y:250}; applyViewTransform();
  });

  document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
  document.getElementById('importJsonBtn').addEventListener('click', ()=> document.getElementById('importFileInput').click());
  document.getElementById('importFileInput').addEventListener('change', importJSONFile);
  document.getElementById('exportPngBtn').addEventListener('click', exportPNG);
  document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);

  document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
}

function zoomBy(factor){
  const r = viewport.getBoundingClientRect();
  const mx = r.width/2, my = r.height/2;
  const wx = (mx-view.pan.x)/view.scale, wy=(my-view.pan.y)/view.scale;
  view.scale = clamp(view.scale*factor, 0.2, 3);
  view.pan.x = mx - wx*view.scale;
  view.pan.y = my - wy*view.scale;
  applyViewTransform();
}

function bindGlobalKeys(){
  document.addEventListener('keydown', (e)=>{
    const tag = document.activeElement.tagName;
    const editable = document.activeElement.isContentEditable;
    if(tag==='INPUT' || tag==='TEXTAREA' || editable) return;
    if(e.key==='Delete' || e.key==='Backspace'){
      if(selected.type){ e.preventDefault(); deleteSelected(); }
    }
    if(e.key==='Escape'){
      if(pendingConnectorFrom){
        cardEls.get(pendingConnectorFrom).classList.remove('connector-pending');
        pendingConnectorFrom = null;
      }
      setMode('select');
      clearSelection();
    }
  });
}

/* =========================================================
   JSON 入出力
========================================================= */
function exportJSON(){
  state.title = docTitleInput.value;
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'history-map') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('JSONファイルを保存しました');
}

function importJSONFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      loadState(data);
      setStatus('JSONファイルを読み込みました');
    }catch(err){
      alert('JSONファイルの読み込みに失敗しました: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function loadState(data){
  // 既存要素を全消去
  cardEls.forEach(el=>el.remove()); cardEls.clear();
  groupEls.forEach(el=>el.remove()); groupEls.clear();
  clearSelection();

  state = {
    title: data.title || '',
    cards: Array.isArray(data.cards) ? data.cards : [],
    connectors: Array.isArray(data.connectors) ? data.connectors : [],
    groups: Array.isArray(data.groups) ? data.groups : []
  };
  docTitleInput.value = state.title;

  state.groups.forEach(renderGroup);
  state.cards.forEach(renderCard);
  renderConnectors();
}

/* =========================================================
   PNG / PDF 出力
========================================================= */
function computeBBox(){
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  state.cards.forEach(c=>{
    const el = cardEls.get(c.id);
    const w = el?el.offsetWidth:220, h = el?el.offsetHeight:70;
    minX = Math.min(minX, c.x); minY = Math.min(minY, c.y);
    maxX = Math.max(maxX, c.x+w); maxY = Math.max(maxY, c.y+h);
  });
  state.groups.forEach(g=>{
    minX = Math.min(minX, g.x); minY = Math.min(minY, g.y);
    maxX = Math.max(maxX, g.x+g.w); maxY = Math.max(maxY, g.y+g.h);
  });
  if(!isFinite(minX)){ minX=0; minY=0; maxX=800; maxY=600; }
  return {minX,minY,maxX,maxY};
}

async function captureCanvas(){
  const bbox = computeBBox();
  const pad = 60;
  const x = bbox.minX-pad, y = bbox.minY-pad;
  const width = (bbox.maxX-bbox.minX)+pad*2;
  const height = (bbox.maxY-bbox.minY)+pad*2;

  const prevTransform = world.style.transform;
  world.style.transform = 'none';
  clearSelectionVisual();

  const canvas = await html2canvas(world, {
    x, y, width, height,
    backgroundColor: '#e3d6b8',
    scale: 2,
    useCORS: true
  });

  world.style.transform = prevTransform;
  if(selected.type==='card') cardEls.get(selected.id)?.classList.add('selected');
  if(selected.type==='group') groupEls.get(selected.id)?.classList.add('selected');
  return canvas;
}

async function exportPNG(){
  setStatus('PNG画像を生成中…');
  try{
    const canvas = await captureCanvas();
    const link = document.createElement('a');
    link.download = (state.title || docTitleInput.value || 'history-map') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    setStatus('PNG画像をダウンロードしました');
  }catch(err){
    console.error(err);
    alert('PNG出力に失敗しました: ' + err.message);
    setStatus('PNG出力に失敗しました');
  }
}

async function exportPDF(){
  setStatus('PDFを生成中…');
  try{
    const canvas = await captureCanvas();
    const { jsPDF } = window.jspdf;
    const ratio = canvas.width / canvas.height;
    const maxDim = 1400;
    let pageW, pageH;
    if(ratio >= 1){ pageW = maxDim; pageH = maxDim/ratio; }
    else { pageH = maxDim; pageW = maxDim*ratio; }
    const pdf = new jsPDF({
      orientation: ratio>=1 ? 'landscape':'portrait',
      unit: 'pt',
      format: [pageW, pageH]
    });
    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 0, 0, pageW, pageH);
    pdf.save((state.title || docTitleInput.value || 'history-map') + '.pdf');
    setStatus('PDFをダウンロードしました');
  }catch(err){
    console.error(err);
    alert('PDF出力に失敗しました: ' + err.message);
    setStatus('PDF出力に失敗しました');
  }
}

/* =========================================================
   起動
========================================================= */
init();

})();
